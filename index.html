<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Crucial for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <title>Kapia Farm Cafe | Welcome</title>
  <link rel="stylesheet" href="./assets/fonts.css">
  <style>
    /* CSS Reset & Base Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --latte-foam: #F4ECE6;
      --latte-crema: #DFBB96;
      --latte-body: #BF8969;
      --latte-espresso: #3D281C;
      --primary-color: var(--latte-body);
      --bg-color: var(--latte-foam);
      --card-bg: #FFFAF6;
      --text-color: var(--latte-espresso);
      --text-muted: #765B4D;
      --radius: 8px;
    }

    body {
      font-family: var(--font-primary);
      background-color: #f5efe9;
      color: var(--text-color);
      line-height: 1.5;
      padding-bottom: 70px; /* Leave room for sticky bottom nav on mobile */
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary-color);
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Hero Banner */
    .hero {
      background: #c79b73;
      color: white;
      padding: 2rem 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      box-shadow: 0 12px 26px rgba(118, 87, 62, 0.18);
    }

    .hero h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* Grid Layout for Mobile Cards */
    .grid {
      display: grid;
      grid-template-columns: 1fr; /* Single column for mobile */
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid #e2e8f0;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    /* Touch-friendly Button (Minimum 44px height for mobile interaction) */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #c78f67;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 10px 20px rgba(122, 88, 61, 0.18);
    }

    /* Sticky Bottom Navigation (Mobile Specific Pattern) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      border-top: 1px solid #e2e8f0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .nav-item.active {
      color: var(--primary-color);
    }

    /* Desktop and Tablet Responsive Adjustments */
    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      body {
        padding-bottom: 0; /* Remove padding when bottom nav is hidden */
      }

      .bottom-nav {
        display: none; /* Hide mobile navigation on desktop screens */
      }

      .grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero h1 {
        font-size: 2rem;
      }
    }

    :root {
      --welcome-ink: var(--latte-espresso);
      --welcome-orange: var(--latte-crema);
      --welcome-paper: var(--latte-foam);
    }

    body {
      min-height: 100vh;
      padding: 0;
      background: #f5efe9;
      color: var(--welcome-ink);
      font-family: var(--font-primary);
    }

    .welcome-hero {
      position: relative;
      display: flex;
      min-height: min(78svh, 760px);
      align-items: center;
      overflow: hidden;
      background: #c79b73;
      color: #fff;
      box-shadow: 0 18px 34px rgba(123, 86, 60, 0.18);
    }

    .welcome-hero::before,
    .welcome-hero::after {
      position: absolute;
      inset: 0;
      content: '';
    }

    .welcome-hero::before {
      background: url('./assets/kapiacafe.webp') center 52% / cover;
      animation: welcome-image-in 1s ease-out both;
    }

    @media (max-width: 640px) {
      .welcome-hero::before {
        background-image: url('./assets/kapiacafe.webp');
      }
    }

    .welcome-hero::after {
      background: linear-gradient(90deg, rgba(61, 40, 28, .82), rgba(61, 40, 28, .48) 62%, rgba(61, 40, 28, .2)), linear-gradient(0deg, rgba(61, 40, 28, .5), transparent 48%);
    }

    .welcome-nav,
    .welcome-copy {
      position: relative;
      z-index: 1;
      width: min(100% - 48px, 1180px);
      margin-inline: auto;
    }

    .welcome-nav {
      position: absolute;
      top: 0;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 24px;
      transform: translateX(-50%);
    }

    .welcome-brand {
      color: #fff;
      font-family: var(--font-primary);
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    .welcome-admin {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 0 17px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s ease, color .2s ease;
      box-shadow: 0 10px 20px rgba(122, 88, 61, 0.18);
    }

    .welcome-admin:hover {
      background: #f0dfcf;
      color: var(--welcome-ink);
    }

    .welcome-copy {
      padding-top: 56px;
      animation: welcome-copy-in .7s .12s ease-out both;
    }

    .welcome-eyebrow {
      margin-bottom: 16px;
      color: var(--latte-crema);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .welcome-copy h1 {
      max-width: 780px;
      margin-bottom: 16px;
      font-family: var(--font-primary);
      font-size: clamp(48px, 7vw, 88px);
      font-weight: 400;
      line-height: 1.02;
    }

    .welcome-copy p {
      max-width: 520px;
      margin-bottom: 30px;
      color: rgba(255,255,255,.88);
      font-size: 18px;
      line-height: 1.65;
    }

    .welcome-cta {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 0 25px;
      border: none;
      border-radius: 10px;
      background: #c88d62;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      box-shadow: 0 12px 22px rgba(122, 88, 61, 0.18);
    }

    .welcome-cta:hover {
      transform: translateY(-2px);
      background: #b77d54;
      box-shadow: 0 14px 26px rgba(122, 88, 61, 0.22);
    }

    .welcome-categories {
      display: grid;
      width: min(100% - 48px, 1180px);
      grid-template-columns: 1fr 1fr 1fr;
      margin: 0 auto;
      padding: 27px 0 33px;
      border-bottom: 1px solid #DCC8B6;
    }

    .welcome-category {
      padding: 0 24px;
      border-left: 1px solid #DCC8B6;
    }

    .welcome-category:first-child {
      padding-left: 0;
      border-left: 0;
    }

    .welcome-category span {
      display: block;
      margin-bottom: 5px;
      color: #765B4D;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .welcome-category strong {
      font-family: var(--font-primary);
      font-size: 19px;
      font-weight: 400;
    }

    @keyframes welcome-image-in {
      from { transform: scale(1.035); }
      to { transform: scale(1); }
    }

    @keyframes welcome-copy-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .welcome-hero { min-height: 74svh; }
      .welcome-nav, .welcome-copy, .welcome-categories { width: calc(100% - 36px); }
      .welcome-nav { padding-top: 18px; }
      .welcome-brand { font-size: 17px; }
      .welcome-admin { padding-inline: 12px; font-size: 13px; }
      .welcome-copy { padding-top: 50px; }
      .welcome-copy h1 { font-size: clamp(46px, 13vw, 68px); }
      .welcome-copy p { font-size: 16px; }
      .welcome-categories { grid-template-columns: 1fr; padding: 14px 0; }
      .welcome-category, .welcome-category:first-child { padding: 13px 0; border: 0; border-top: 1px solid #DCC8B6; }
      .welcome-category:first-child { border-top: 0; }
      .welcome-category strong { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="welcome-hero">
      <nav class="welcome-nav" aria-label="Main navigation">
        <a class="welcome-brand" href="./index.html">Kapia Farm Cafe</a>
        <a class="welcome-admin" href="./admin.html">Login</a>
      </nav>
      <div class="welcome-copy">
        <div class="welcome-eyebrow">Farm essentials, made closer</div>
        <h1>Kapia Farm Cafe</h1>
        <p>Shop quality farm supplies, feeds, and freshly prepared food and drinks, all in one place.</p>
        <a class="welcome-cta" href="./Kapia_Farm_Cafe_w%20admin.html">Explore the store</a>
      </div>
    </section>
    <section class="welcome-categories" aria-label="Store categories">
      <div class="welcome-category"><span>01</span><strong>Fertilizer</strong></div>
      <div class="welcome-category"><span>02</span><strong>Feeds</strong></div>
      <div class="welcome-category"><span>03</span><strong>Foods &amp; Drinks</strong></div>
    </section>
  </main>
</body>
</html>
